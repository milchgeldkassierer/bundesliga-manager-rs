[workspace]
resolver = "2"
members = ["crates/bmp-formats", "crates/bmp-game", "crates/bmp-sound", "crates/bmp"]

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT"

[workspace.dependencies]
bmp-formats = { path = "crates/bmp-formats" }
bmp-game = { path = "crates/bmp-game" }
bmp-sound = { path = "crates/bmp-sound" }
